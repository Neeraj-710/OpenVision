name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install Tools
        run: brew install xcodegen
      - name: Create Config.xcconfig
        run: |
          cp Config.xcconfig.example Config.xcconfig
          echo "Created Config.xcconfig"
          ls -la Config.xcconfig
      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project OpenVision.xcodeproj \
            -scheme OpenVision \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/OpenVision.xcarchive \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/OpenVision.xcarchive/Products/Applications/OpenVision.app Payload/
          zip -r OpenVision.ipa Payload

      - name: Upload Finished IPA File
        uses: actions/upload-artifact@v4
        with:
          name: OpenVision-App
          path: OpenVision.ipa
